<!DOCTYPE html>
<html>
<head>
<title>Register</title>
</head>
<body style="text-align:center;margin-top:100px;font-family:Arial;background:#1e1e2f;color:white;">

<h2>Register</h2>

<input type="text" id="newUsername" placeholder="Username"><br><br>
<input type="password" id="newPassword" placeholder="Password"><br><br>

<button onclick="register()">Daftar</button>

<script>
function register(){
  let user = document.getElementById("newUsername").value;
  let pass = document.getElementById("newPassword").value;

  localStorage.setItem("username", user);
  localStorage.setItem("password", pass);

  alert("Akun berhasil dibuat!");
  window.location.href="index.html";
}
</script>

</body>
</html>
