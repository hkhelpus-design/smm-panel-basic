<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - SMM Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    .header {
      background: #764ba2;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .content {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #764ba2;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Dashboard</h2>
  </div>

  <div class="content">
    <div class="card">
      <h3>Saldo: Rp <span id="saldo">0</span></h3>
<button onclick="tambahSaldo()">Tambah Saldo</button>
    </div>

    <div class="card">
      <h3>Buat Order</h3>
     <button onclick="window.location.href='order.html'">
  Order
</button>Order Sekarang</button>
    </div>
  </div>
<script>
let saldo = 0;

function tambahSaldo() {
  saldo += 10000;
  document.getElementById("saldo").innerText = saldo;
}
</script>
</body>
</html>
